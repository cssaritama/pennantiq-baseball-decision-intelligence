  umpire_abs_context:
    status: roadmap_rule_dependent
    release: public_method_private_data
  integrity_governance:
    status: roadmap
    release: enterprise_private
  fan_simulation_game:
    status: optional_acquisition_surface
    release: public_after_core_validation
    boundary: educational simulation; not the commercial decision moat

  decision_council:
    status: implemented_baseline
    release: public
    decision: multi-specialist evidence synthesis with human approval
  dynasty_benchmark:
    status: roadmap_research
    release: public_method
    decision: compare repeat-champion public performance patterns without inferring private mechanisms
