name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-evaluate-and-container-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q src app.py evaluation scripts tests

      - name: Tests
        run: pytest -q

      - name: Automated dlt ingestion
        run: |
          rm -rf .dlt
          rm -f pennantiq.duckdb
          python -m src.pennantiq.ingestion

      - name: Retrieval evaluation
        run: python evaluation/run_retrieval_evaluation.py

      - name: Offline answer-policy evaluation
        run: python evaluation/run_answer_evaluation.py

      - name: Shadow Mode
        run: python scripts/run_shadow_mode.py

      - name: Repository audit
        run: python scripts/audit_repository.py

      - name: Build Docker Compose application
        run: docker compose build

      - name: Start application container
        run: docker compose up -d

      - name: Streamlit health check
        run: |
          curl --fail --retry 18 --retry-delay 5 --retry-all-errors http://localhost:8501/_stcore/health

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down -v